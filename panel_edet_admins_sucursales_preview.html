<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel EDET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const API_URL = "https://ticse.edetsa.com/Ags/rest/services/AGOL/AGOL_OMS_PRO/MapServer/4/query?f=json&cacheHint=false&resultOffset=0&resultRecordCount=7500&where=1%3D1&orderByFields=&outFields=*&returnGeometry=true&outSR=4326&spatialRel=esriSpatialRelIntersects";

    const ADMINISTRACIONES = [
      { nombre: "TODAS", etiqueta: "Todas" },
      { nombre: "CONCEPCION", etiqueta: "Concepción" },
      { nombre: "METROPOLITANA", etiqueta: "Metropolitana" },
      { nombre: "BANDA DEL RIO SALI", etiqueta: "Banda del Río Salí" },
      { nombre: "TAFI VIEJO", etiqueta: "Tafí Viejo" },
      { nombre: "MONTEROS", etiqueta: "Monteros" },
    ];

    const SUCURSALES = [
      { sucursal: "AGUILARES", administracion: "CONCEPCION", codigo: "AGU" },
      { sucursal: "AMAICHA DEL VALLE", administracion: "MONTEROS", codigo: "ADV" },
      { sucursal: "BANDA DEL RIO SALI", administracion: "BANDA DEL RIO SALI", codigo: "BRS" },
      { sucursal: "BELLA VISTA", administracion: "MONTEROS", codigo: "BV" },
      { sucursal: "BURRUYACU", administracion: "BANDA DEL RIO SALI", codigo: "BUR" },
      { sucursal: "COLALAO DEL VALLE", administracion: "MONTEROS", codigo: "COL" },
      { sucursal: "CONCEPCION", administracion: "CONCEPCION", codigo: "CON" },
      { sucursal: "FAMAILLA", administracion: "MONTEROS", codigo: "FAM" },
      { sucursal: "J.B. ALBERDI", administracion: "CONCEPCION", codigo: "ALB" },
      { sucursal: "LA COCHA", administracion: "CONCEPCION", codigo: "LCH" },
      { sucursal: "LAMADRID", administracion: "CONCEPCION", codigo: "LAM" },
      { sucursal: "LAS CEJAS", administracion: "BANDA DEL RIO SALI", codigo: "LCE" },
      { sucursal: "LOS RALOS", administracion: "BANDA DEL RIO SALI", codigo: "LRA" },
      { sucursal: "LULES", administracion: "MONTEROS", codigo: "LUL" },
      { sucursal: "METROPOLITANA", administracion: "METROPOLITANA", codigo: "METRO" },
      { sucursal: "MONTEROS", administracion: "MONTEROS", codigo: "MON" },
      { sucursal: "SAN PEDRO DE COLALAO", administracion: "TAFI VIEJO", codigo: "SP" },
      { sucursal: "SIMOCA", administracion: "MONTEROS", codigo: "SIM" },
      { sucursal: "STA. ROSA DE LEALES", administracion: "BANDA DEL RIO SALI", codigo: "SRL" },
      { sucursal: "TACO RALO", administracion: "CONCEPCION", codigo: "TR" },
      { sucursal: "TAFI DEL VALLE", administracion: "MONTEROS", codigo: "TDV" },
      { sucursal: "TAFI VIEJO", administracion: "TAFI VIEJO", codigo: "TV" },
      { sucursal: "TRANCAS", administracion: "TAFI VIEJO", codigo: "TRA" },
      { sucursal: "YERBA BUENA", administracion: "TAFI VIEJO", codigo: "YB" },
    ];

    let incidentes = [];
    let incidenteAbierto = null;
    let cargando = false;
    let errorConsulta = "";
    let ultimaActualizacion = "Sin actualizar";
    let administracionSeleccionada = "TODAS";

    function normalizarTexto(valor) {
      return String(valor || "")
        .trim()
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function normalizarAdministracion(valor) {
      const admin = normalizarTexto(valor);

      if (admin.includes("CONCEPC")) return "CONCEPCION";
      if (admin.includes("METROP")) return "METROPOLITANA";
      if (admin.includes("BANDA") || admin.includes("RIO SALI")) return "BANDA DEL RIO SALI";
      if (admin.includes("TAFI")) return "TAFI VIEJO";
      if (admin.includes("MONTER")) return "MONTEROS";

      return admin || "Sin administración";
    }

    function normalizarSucursal(valor) {
      const sucursal = normalizarTexto(valor);

      if (sucursal.includes("AGUIL")) return "AGUILARES";
      if (sucursal.includes("AMAICHA")) return "AMAICHA DEL VALLE";
      if (sucursal.includes("BANDA") || sucursal.includes("RIO SALI")) return "BANDA DEL RIO SALI";
      if (sucursal.includes("BELLA")) return "BELLA VISTA";
      if (sucursal.includes("BURRUYACU")) return "BURRUYACU";
      if (sucursal.includes("COLALAO") && sucursal.includes("VALLE")) return "COLALAO DEL VALLE";
      if (sucursal.includes("CONCEPC")) return "CONCEPCION";
      if (sucursal.includes("FAMAIL")) return "FAMAILLA";
      if (sucursal.includes("J.B") || sucursal.includes("ALBERDI")) return "J.B. ALBERDI";
      if (sucursal.includes("COCHA")) return "LA COCHA";
      if (sucursal.includes("LAMADRID")) return "LAMADRID";
      if (sucursal.includes("CEJAS")) return "LAS CEJAS";
      if (sucursal.includes("RALOS")) return "LOS RALOS";
      if (sucursal.includes("LULES")) return "LULES";
      if (sucursal.includes("METROP")) return "METROPOLITANA";
      if (sucursal.includes("MONTER")) return "MONTEROS";
      if (sucursal.includes("SAN PEDRO")) return "SAN PEDRO DE COLALAO";
      if (sucursal.includes("SIMOCA")) return "SIMOCA";
      if (sucursal.includes("ROSA") || sucursal.includes("LEALES")) return "STA. ROSA DE LEALES";
      if (sucursal.includes("TACO RALO")) return "TACO RALO";
      if (sucursal.includes("TAFI DEL VALLE")) return "TAFI DEL VALLE";
      if (sucursal.includes("TAFI VIEJO")) return "TAFI VIEJO";
      if (sucursal.includes("TRANCAS")) return "TRANCAS";
      if (sucursal.includes("YERBA")) return "YERBA BUENA";

      return sucursal || "SIN SUCURSAL";
    }

    function codigoSucursal(nombreSucursal) {
      const normalizada = normalizarSucursal(nombreSucursal);
      const encontrada = SUCURSALES.find(s => s.sucursal === normalizada);
      return encontrada ? encontrada.codigo : normalizada.substring(0, 4);
    }

    function barraColorPorEstado(estado) {
      const e = normalizarTexto(estado);

      if (e.includes("ASIGN")) return "bg-emerald-500";
      if (e.includes("CREADO") || e.includes("NUEVO")) return "bg-red-500";

      return "bg-amber-500";
    }

    function badgeColorPorEstado(estado) {
      const e = normalizarTexto(estado);

      if (e.includes("ASIGN")) return "bg-emerald-100 text-emerald-700 border-emerald-200";
      if (e.includes("CREADO") || e.includes("NUEVO")) return "bg-red-100 text-red-700 border-red-200";

      return "bg-amber-100 text-amber-700 border-amber-200";
    }

    function formatearHoraActual() {
      return new Date().toLocaleTimeString("es-AR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function leerCampo(a, nombres, defecto = "") {
      for (const nombre of nombres) {
        if (a[nombre] !== undefined && a[nombre] !== null && a[nombre] !== "") {
          return a[nombre];
        }
      }
      return defecto;
    }

    function consultarDatos() {
      if (cargando) return;

      cargando = true;
      errorConsulta = "";
      render();

      const callbackName = "edetCallback_" + Date.now();
      const script = document.createElement("script");
      const separador = API_URL.includes("?") ? "&" : "?";

      const timeout = setTimeout(() => {
        limpiar();
        cargando = false;
        errorConsulta = "La consulta no respondió. Probá actualizar de nuevo.";
        render();
      }, 15000);

      function limpiar() {
        clearTimeout(timeout);
        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function(data) {
        try {
          const features = Array.isArray(data.features) ? data.features : [];

          incidentes = features.map((f, index) => {
            const a = f.attributes || {};
            const adminOriginal = leerCampo(a, ["ADMINSITRACION", "ADMINISTRACION", "ADMINISTRATION"], "");
            const sucursalOriginal = leerCampo(a, ["SUCURSAL", "Substation", "SUBSTATION", "SET"], "");

            return {
              id:
                a.ID ||
                a.INCIDENT_ID ||
                a.INCIDENTID ||
                a.TICKET_ID ||
                a.OBJECTID ||
                index + 1,
              usuarios: Number(leerCampo(a, ["CUSTOMER_COUNT", "USUARIOS", "CLIENTES", "CANT_USUARIOS"], 0)),
              estado: leerCampo(a, ["STATUS", "ESTADO", "ESTADO_INCIDENTE", "INCIDENT_STATUS"], "Sin estado"),
              administracion: normalizarAdministracion(adminOriginal),
              administracionOriginal: adminOriginal || "Sin administración",
              sucursal: normalizarSucursal(sucursalOriginal),
              observacion: leerCampo(a, ["OBSERVACION_DESPACHANTE", "OBSERVACION", "COMMENTS", "DESCRIPCION", "DESCRIPTION"], "Sin detalle"),
              lat: f.geometry?.y || null,
              lng: f.geometry?.x || null,
              raw: a,
            };
          });

          ultimaActualizacion = formatearHoraActual();

          if (features.length === 0) {
            errorConsulta = "La consulta respondió, pero no trajo incidentes activos.";
          }
        } catch (e) {
          errorConsulta = "Error procesando la respuesta: " + e.message;
        } finally {
          cargando = false;
          limpiar();
          render();
        }
      };

      script.onerror = function() {
        cargando = false;
        limpiar();
        errorConsulta = "No se pudo conectar con la consulta de EDET.";
        render();
      };

      script.src = API_URL + separador + "callback=" + encodeURIComponent(callbackName) + "&_ts=" + Date.now();
      document.body.appendChild(script);
    }

    function incidentesFiltrados() {
      let lista = administracionSeleccionada === "TODAS"
        ? incidentes
        : incidentes.filter(i => i.administracion === administracionSeleccionada);

      return [...lista].sort((a, b) => b.usuarios - a.usuarios);
    }

    function datosGrafico(incidentesVista) {
      if (administracionSeleccionada === "TODAS") {
        return ADMINISTRACIONES
          .filter(a => a.nombre !== "TODAS")
          .map((a) => {
            const total = incidentesVista
              .filter(i => i.administracion === a.nombre)
              .reduce((acc, i) => acc + i.usuarios, 0);

            return {
              nombre: a.etiqueta,
              codigo: a.etiqueta.substring(0, 3).toUpperCase(),
              usuarios: total
            };
          });
      }

      return SUCURSALES
        .filter(s => s.administracion === administracionSeleccionada)
        .map((s) => {
          const total = incidentesVista
            .filter(i => i.sucursal === s.sucursal)
            .reduce((acc, i) => acc + i.usuarios, 0);

          return {
            nombre: s.sucursal,
            codigo: s.codigo,
            usuarios: total
          };
        });
    }

    function cambiarAdministracion(valor) {
      administracionSeleccionada = valor;
      incidenteAbierto = null;
      render();
    }

    function render() {
      const vista = incidentesFiltrados();
      const totalUsuarios = vista.reduce((acc, i) => acc + i.usuarios, 0);
      const grafico = datosGrafico(vista);
      const maxUsuarios = Math.max(...grafico.map(s => s.usuarios), 1);
      const adminEtiqueta = ADMINISTRACIONES.find(a => a.nombre === administracionSeleccionada)?.etiqueta || administracionSeleccionada;

      document.getElementById("app").innerHTML = `
        <div class="max-w-md mx-auto p-4 space-y-4">

          <div class="bg-slate-950 text-white rounded-3xl p-5 shadow-xl">
            <div class="flex justify-between items-start gap-3">
              <div>
                <p class="text-yellow-300 text-sm font-semibold">⚡ EDET / OMS</p>
                <h1 class="text-2xl font-bold mt-1">Incidentes activos</h1>
                <p class="text-slate-400 text-sm">${adminEtiqueta}</p>
              </div>

              <button onclick="consultarDatos()"
                class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-2xl text-sm disabled:opacity-50"
                ${cargando ? "disabled" : ""}>
                ${cargando ? "Actualizando..." : "Actualizar"}
              </button>
            </div>

            <div class="mt-5">
              <label class="text-xs text-slate-300 block mb-1">Administración</label>
              <select
                onchange="cambiarAdministracion(this.value)"
                class="w-full rounded-2xl bg-white/10 border border-white/10 text-white px-3 py-3 outline-none"
              >
                ${ADMINISTRACIONES.map(a => `
                  <option value="${a.nombre}" ${administracionSeleccionada === a.nombre ? "selected" : ""} class="text-slate-900">
                    ${a.etiqueta}
                  </option>
                `).join("")}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-5">
              <div class="bg-white/10 rounded-2xl p-3">
                <p class="text-xs text-slate-300">Incidentes</p>
                <p class="text-2xl font-bold">${vista.length}</p>
              </div>

              <div class="bg-white/10 rounded-2xl p-3">
                <p class="text-xs text-slate-300">Usuarios afectados</p>
                <p class="text-2xl font-bold">${totalUsuarios}</p>
              </div>
            </div>

            <p class="text-xs text-slate-500 mt-4">Última actualización: ${ultimaActualizacion}</p>
            <p class="text-xs text-slate-600 mt-1">Actualiza automáticamente cada 30 segundos</p>
          </div>

          ${errorConsulta ? `
            <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-3xl p-4 text-sm">
              ⚠️ ${errorConsulta}
            </div>
          ` : ""}

          <div class="bg-white rounded-3xl p-4 shadow border border-slate-200">
            <div class="flex justify-between items-center mb-4">
              <h2 class="font-bold text-slate-900">📊 ${administracionSeleccionada === "TODAS" ? "Usuarios por administración" : "Usuarios por sucursal"}</h2>
              <span class="text-xs text-slate-400">Total ${totalUsuarios}</span>
            </div>

            <div class="h-56 flex items-end justify-between gap-2 border-b border-slate-200 pb-2">
              ${grafico.map(item => {
                const alto = item.usuarios === 0
                  ? 0
                  : Math.max((item.usuarios / maxUsuarios) * 100, 10);

                return `
                  <div class="flex-1 h-full flex flex-col justify-end items-center" title="${item.nombre}">
                    <div class="text-xs font-bold text-slate-700 mb-1">${item.usuarios}</div>
                    <div class="w-full max-w-10 h-full flex items-end justify-center">
                      <div class="w-full rounded-t-xl bg-slate-900" style="height:${alto}%"></div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="grid gap-2 pt-2" style="grid-template-columns: repeat(${grafico.length}, minmax(0, 1fr));">
              ${grafico.map(item => `
                <div class="text-center text-[10px] font-bold text-slate-700 truncate" title="${item.nombre}">
                  ${item.codigo}
                </div>
              `).join("")}
            </div>
          </div>

          ${vista.map(i => `
            <div onclick="toggleDetalle('${i.id}')"
              class="bg-white rounded-3xl overflow-hidden shadow border border-slate-200 cursor-pointer">

              <div class="h-2 ${barraColorPorEstado(i.estado)}"></div>

              <div class="p-4">
                <div class="flex justify-between items-start gap-3">
                  <div>
                    <h2 class="font-bold text-slate-900 text-lg">
                      Incidente #${i.id}
                    </h2>

                    <p class="text-sm text-slate-500 mt-1">
                      Administración: ${i.administracionOriginal}
                    </p>

                    <p class="text-sm text-slate-500">
                      Sucursal: ${i.sucursal} (${codigoSucursal(i.sucursal)})
                    </p>
                  </div>

                  <span class="text-xs font-bold border rounded-full px-3 py-1 ${badgeColorPorEstado(i.estado)}">
                    ${i.estado}
                  </span>
                </div>

                <div class="flex items-center gap-2 mt-4">
                  <span class="text-3xl">👥</span>
                  <span class="text-4xl font-bold text-slate-900">${i.usuarios}</span>
                  <span class="text-slate-500">usuarios afectados</span>
                </div>

                <div class="mt-4 bg-slate-50 rounded-2xl p-3 text-slate-700">
                  ⚠️ ${i.observacion}
                </div>

                ${incidenteAbierto === String(i.id) ? `
                  <div class="mt-4 rounded-2xl border border-slate-200 p-3 text-sm space-y-2">
                    <p><b>SET:</b> ${i.raw.Substation || i.raw.SUBSTATION || i.raw.SET || 'Sin SET'}</p>
                    <p><b>Administración:</b> ${i.administracionOriginal}</p>
                    <p><b>Sucursal:</b> ${i.sucursal}</p>
                    <p><b>Estado:</b> ${i.estado}</p>
                    <p><b>Usuarios:</b> ${i.usuarios}</p>

                    ${i.lat && i.lng ? `
                      <p><b>Coordenadas:</b> ${i.lat}, ${i.lng}</p>

                      <a href="https://www.google.com/maps?q=${i.lat},${i.lng}"
                        target="_blank"
                        onclick="event.stopPropagation()"
                        class="block text-center bg-blue-700 text-white rounded-xl py-2 font-semibold mt-3">
                        Abrir en Google Maps
                      </a>
                    ` : ''}

                    <details class="mt-3 bg-slate-50 rounded-xl p-3" onclick="event.stopPropagation()">
                      <summary class="font-semibold">Ver JSON original</summary>

                      <div class="mt-2 space-y-1 text-xs max-h-64 overflow-auto">
                        ${Object.entries(i.raw).map(([k,v]) => `
                          <p class="break-words"><b>${k}:</b> ${v}</p>
                        `).join("")}
                      </div>
                    </details>
                  </div>
                ` : ''}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function toggleDetalle(id) {
      incidenteAbierto = incidenteAbierto === id ? null : id;
      render();
    }

    render();
    consultarDatos();

    setInterval(() => {
      consultarDatos();
    }, 30000);
  </script>
</body>
</html>
